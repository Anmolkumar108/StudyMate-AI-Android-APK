services:
  - type: web
    name: studymate-backend-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "true"
      - key: SECRET_KEY
        value: "studymate-production-ultra-secure-jwt-secret-key-2026-auth-token-engine-9988"
      - key: DATABASE_URL
        fromDatabase:
          name: studymate-postgres
          property: connectionString
      - key: PRIMARY_AI_PROVIDER
        value: gemini
      - key: AI_MODEL_NAME
        value: gemini-3.1-flash-lite
      - key: AI_API_KEY
        sync: false
      - key: ADMIN_SECURITY_KEY
        value: "979831"

databases:
  - name: studymate-postgres
    databaseName: studymate_db
    user: studymate_user
    plan: free
